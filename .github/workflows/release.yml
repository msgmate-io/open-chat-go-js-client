name: Release

# Builds the package, commits the built dist/, and creates (or force-updates)
# a release tag. Committing dist/ means `npm i github:<repo>#<tag>` works with
# no auth and no build step on the consumer side.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Defaults to v<package.json version>."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build, commit dist, tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve tag name
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      - name: Commit built dist
        run: |
          set -euo pipefail
          git config user.name "open-chat-release-bot"
          git config user.email "open-chat-release-bot@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "dist unchanged; nothing to commit"
          else
            git commit -m "chore(release): build dist for ${{ steps.tag.outputs.tag_name }}"
            git push
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag_name }}"
          git tag -f "$TAG"
          git push origin -f "refs/tags/$TAG"
          echo "Tagged $(git rev-parse HEAD) as $TAG"

      - name: Summary
        run: |
          TAG="${{ steps.tag.outputs.tag_name }}"
          REPO="${{ github.repository }}"
          {
            echo "Release tag **${TAG}** published."
            echo ""
            echo "Install with:"
            echo "\`\`\`"
            echo "npm i github:${REPO}#${TAG}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
